[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wifisense-ultra"
version = "1.0.1"
description = "Camera-free Wi-Fi CSI sensing research and automation platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Rohith Bommalla Naresh"}]
license = {text = "MIT"}
dependencies = [
  "Flask>=3.1,<4",
  "waitress>=3.0,<4",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
ml = ["torch>=2.3,<3"]
homeassistant = ["paho-mqtt>=2.1,<3"]
full = ["torch>=2.3,<3", "paho-mqtt>=2.1,<3", "flask-cors>=5,<7"]
dev = ["pytest>=8,<10"]

[project.scripts]
wifisense-ultra = "wifisense_ultra.main:main"

[tool.setuptools.packages.find]
include = ["wifisense_ultra*", "wifisense_pro*"]

[tool.setuptools.package-data]
wifisense_ultra = ["dashboard/*.html"]
