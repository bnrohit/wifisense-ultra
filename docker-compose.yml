services:
  wifisense:
    build:
      context: .
      args:
        INSTALL_EXTRAS: ${WIFISENSE_INSTALL_EXTRAS:-core}
    init: true
    ports:
      - "${WIFISENSE_WEB_PORT:-5000}:5000"
      - "${WIFISENSE_TCP_PORT:-8089}:8089"
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      WIFISENSE_HOST: 0.0.0.0
      WIFISENSE_WEB_PORT: 5000
      WIFISENSE_TCP_PORT: 8089
      WIFISENSE_DATA_DIR: /app/data
    restart: unless-stopped
    stop_grace_period: 20s
